<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — BeeMarket Stock Monitor</title>
<meta name="robots" content="noindex">

:root{--bg:#f6f5f1;--ink:#17181b;--muted:#666a72;--line:#e3e1da;--accent:#f2b705}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}

.code{font:700 64px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:-.02em}
.code span{color:var(--accent)}
p{color:var(--muted)}
a{display:inline-block;margin-top:8px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600;padding:10px 16px;border-radius:8px}

</head>

<main>
